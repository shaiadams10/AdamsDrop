name: adams-drop
services:
  adams-drop:
    build: .
    container_name: adams-drop
    restart: unless-stopped
    env_file: .env
    ports:
      - "8765:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
